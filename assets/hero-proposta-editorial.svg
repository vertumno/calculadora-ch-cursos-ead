<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" role="img" aria-labelledby="title desc">
  <title id="title">Um MOOC de 20 horas, medido atividade por atividade</title>
  <desc id="desc">Régua vertical de zero a vinte horas com o curso de exemplo empilhado nela: 49 faixas, uma por atividade, agrupadas em 4 módulos. A altura de cada faixa é o tempo que a atividade pede do estudante e a cor diz se ela é de aquisição ou de prática. A pilha fecha na marca das vinte horas declaradas.</desc>
